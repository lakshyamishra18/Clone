<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notion</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Navigation bar  -->
    <nav class="navbar g-3">
      <div class="left">
        <img src="https://a.favicon.im/notion.so" alt="Notion" class="logo" />
      </div>
      <div class="centre">
        <select name="Product" class="select1">
          <option value="">Product</option>
        </select>
        <select name="Product" class="select2">
          <option value="">Resources</option>
        </select>
        <a href="">Pricing</a>
        <a href="">Request a Demo</a>
      </div>
      <div class="right">
        <a href="">Log Out</a>
        <a href="" class="open_notion">Open Notion</a>
      </div>
    </nav>
    <div class="container-fluid ">
        <section class="section1">
            <div class="heading">
                <h1>
                    Where teams and agents
                    <span>Create</span>
                    <span>together</span>
                </h1>
                <p>Capture context, find answers, and automate tasks with AI built for your team.
                </p>
                <div class="boxes">
                    <button class="button1">Get Notion Free</button>
                    <button class="button2">Request a Demo</button>
                </div>
            </div>
        </section>
        <section class="section2">
            <div class="Design">
                <div class="image">
                    <img src="https://www.notion.com/front-static/accent-illustrations/agentTop.png?v=2" alt="Mundi" width="480" height="510" id="image1">
                </div>
                <div class="vedio">
                    <video id="vedio"  muted autoplay loop>
                        <source src="https://videos.ctfassets.net/spoqsaf9291f/1EL7UZIXfcqngxsNSbL8tR/291f61f56f29dd8e788deaec8561d882/web-homepage-hero-1920x1200_final.mp4" type="video/mp4" >
                    </video>
                </div>
                <div class="image">
                    <img src="https://www.notion.com/front-static/accent-illustrations/personPeekLeft2.png?v=1" alt="spying" width="480" height="510" id="image2">
                </div>
                
            </div>
        </section>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
